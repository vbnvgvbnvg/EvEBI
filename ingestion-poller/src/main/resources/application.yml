server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ingestion-poller

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/eve_market}
    username: ${RABBITMQ_USER:poller_producer}
    password: ${RABBITMQ_PASS:eve_password}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
      algorithm: ${RABBITMQ_SSL_ALGORITHM:TLSv1.3}

eve:
  poller:
    esi:
      base-url: ${EVE_ESI_BASE_URL:https://esi.evetech.net/latest}
      user-agent: ${EVE_ESI_USER_AGENT:EveBI-IngestionPoller/1.0.0 (https://github.com/serbentd/EvEBI)}
      connect-timeout: ${EVE_ESI_CONNECT_TIMEOUT:10s}
      read-timeout: ${EVE_ESI_READ_TIMEOUT:30s}
      max-in-memory-size: ${EVE_ESI_MAX_IN_MEMORY_SIZE:16MB}
      min-error-remain-threshold: ${EVE_ESI_ERROR_THRESHOLD:20}
      resilience-instance: ${EVE_ESI_RESILIENCE_INSTANCE:esi}
    scheduling:
      regions:
        - ${EVE_POLLER_REGION_ID:10000002}
      initial-delay: ${EVE_POLLER_INITIAL_DELAY:PT5S}
      fixed-rate: ${EVE_POLLER_FIXED_RATE:PT1H}
    amqp:
      exchange: ${EVE_MARKET_EXCHANGE:eve.market.orders}
      routing-key: ${EVE_MARKET_ROUTING_KEY:eve.market.orders}
    discovery:
      enabled: ${EVE_POLLER_DISCOVERY_ENABLED:true}
      min-region-id: ${EVE_POLLER_MIN_REGION_ID:10000000}
      max-region-id: ${EVE_POLLER_MAX_REGION_ID:11000000}
      refresh-rate: ${EVE_POLLER_DISCOVERY_REFRESH_RATE:PT24H}
      compatibility-date: ${EVE_POLLER_COMPATIBILITY_DATE:2020-01-01}
  security:
    username: ${EVE_SECURITY_USER:eve_admin}
    password: ${EVE_SECURITY_PASSWORD:eve_password}
    api-key-header: ${EVE_SECURITY_API_KEY_HEADER:X-API-Key}
    admin-api-keys: ${EVE_SECURITY_API_KEYS:eve_local_api_key}
    actuator-api-keys: ${EVE_SECURITY_ACTUATOR_API_KEYS:eve_local_actuator_key}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, rabbit
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

resilience4j:
  ratelimiter:
    instances:
      esi:
        limit-for-period: ${EVE_ESI_RL_LIMIT_FOR_PERIOD:20}
        limit-refresh-period: ${EVE_ESI_RL_REFRESH_PERIOD:1s}
        timeout-duration: ${EVE_ESI_RL_TIMEOUT_DURATION:5s}
        register-health-indicator: true
        allow-health-indicator-to-fail: false
  circuitbreaker:
    instances:
      esi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${EVE_ESI_CB_SLIDING_WINDOW_SIZE:20}
        minimum-number-of-calls: ${EVE_ESI_CB_MIN_CALLS:10}
        failure-rate-threshold: ${EVE_ESI_CB_FAILURE_RATE_THRESHOLD:50}
        permitted-number-of-calls-in-half-open-state: ${EVE_ESI_CB_HALF_OPEN_CALLS:3}
        wait-duration-in-open-state: ${EVE_ESI_CB_WAIT_DURATION:30s}
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        record-failure-predicate: com.github.serbentd.eve.poller.client.EsiCircuitBreakerFailurePredicate
        ignore-exceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
  retry:
    instances:
      esi:
        max-attempts: ${EVE_ESI_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${EVE_ESI_RETRY_WAIT_DURATION:1s}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: ${EVE_ESI_RETRY_BACKOFF_MULTIPLIER:2.0}
        exponential-max-wait-duration: ${EVE_ESI_RETRY_MAX_WAIT_DURATION:10s}
        enable-randomized-wait: true
        randomized-wait-factor: ${EVE_ESI_RETRY_RANDOMIZED_FACTOR:0.5}
        retry-exception-predicate: com.github.serbentd.eve.poller.client.EsiRetryExceptionPredicate
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
