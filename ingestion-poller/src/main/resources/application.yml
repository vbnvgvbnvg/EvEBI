server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ingestion-poller

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/eve_market}
    username: ${RABBITMQ_USER:poller_producer}
    password: ${RABBITMQ_PASS:eve_password}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
      algorithm: ${RABBITMQ_SSL_ALGORITHM:TLSv1.3}

eve:
  poller:
    esi:
      base-url: ${EVE_ESI_BASE_URL:https://esi.evetech.net/latest}
      user-agent: ${EVE_ESI_USER_AGENT:EveBI-IngestionPoller/1.0.0 (https://github.com/serbentd/EvEBI)}
      connect-timeout: ${EVE_ESI_CONNECT_TIMEOUT:10s}
      read-timeout: ${EVE_ESI_READ_TIMEOUT:30s}
      max-in-memory-size: ${EVE_ESI_MAX_IN_MEMORY_SIZE:16MB}
      min-error-remain-threshold: ${EVE_ESI_ERROR_THRESHOLD:20}
    scheduling:
      regions:
        - ${EVE_POLLER_REGION_ID:10000002}
      initial-delay: ${EVE_POLLER_INITIAL_DELAY:PT5S}
      fixed-rate: ${EVE_POLLER_FIXED_RATE:PT1H}
    amqp:
      exchange: ${EVE_MARKET_EXCHANGE:eve.market.orders}
      routing-key: ${EVE_MARKET_ROUTING_KEY:eve.market.orders}
    discovery:
      enabled: ${EVE_POLLER_DISCOVERY_ENABLED:true}
      min-region-id: ${EVE_POLLER_MIN_REGION_ID:10000000}
      max-region-id: ${EVE_POLLER_MAX_REGION_ID:11000000}
      refresh-rate: ${EVE_POLLER_DISCOVERY_REFRESH_RATE:PT24H}
      compatibility-date: ${EVE_POLLER_COMPATIBILITY_DATE:2020-01-01}
  security:
    username: ${EVE_SECURITY_USER:eve_admin}
    password: ${EVE_SECURITY_PASSWORD:eve_password}
    api-key-header: ${EVE_SECURITY_API_KEY_HEADER:X-API-Key}
    admin-api-keys: ${EVE_SECURITY_API_KEYS:eve_local_api_key}
    actuator-api-keys: ${EVE_SECURITY_ACTUATOR_API_KEYS:eve_local_actuator_key}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, rabbit
