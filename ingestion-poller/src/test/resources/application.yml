spring:
  application:
    name: ingestion-poller-test
  rabbitmq:
    listener:
      simple:
        auto-startup: false

eve:
  poller:
    esi:
      base-url: http://localhost:8089
      user-agent: EvEBI-TestClient/1.0
      connect-timeout: 2s
      read-timeout: 5s
      max-in-memory-size: 1MB
      min-error-remain-threshold: 20
      resilience-instance: esi
    scheduling:
      regions:
        - 10000002
      initial-delay: PT1H
      fixed-rate: PT1H
    amqp:
      exchange: test.market.orders
      routing-key: test.market.orders.raw
    discovery:
      enabled: false
      min-region-id: 10000000
      max-region-id: 11000000
      refresh-rate: PT24H
      compatibility-date: 2020-01-01
  security:
    username: test-admin
    password: test-password
    api-key-header: X-API-Key
    admin-api-keys:
      - test-api-key
      - test-admin-key-rotated
    actuator-api-keys:
      - test-actuator-key
      - test-actuator-key-rotated

management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    rabbit:
      enabled: false
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

resilience4j:
  ratelimiter:
    instances:
      esi:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 100ms
        register-health-indicator: true
        allow-health-indicator-to-fail: false
  circuitbreaker:
    instances:
      esi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 2
        wait-duration-in-open-state: 500ms
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        record-failure-predicate: com.github.serbentd.eve.poller.client.EsiCircuitBreakerFailurePredicate
        ignore-exceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
  retry:
    instances:
      esi:
        max-attempts: 3
        wait-duration: 10ms
        enable-exponential-backoff: false
        enable-randomized-wait: false
        retry-exception-predicate: com.github.serbentd.eve.poller.client.EsiRetryExceptionPredicate
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
