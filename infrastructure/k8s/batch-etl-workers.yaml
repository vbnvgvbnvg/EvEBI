apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-batch-worker
  labels:
    app.kubernetes.io/name: eve-batch-worker
    app.kubernetes.io/part-of: eve-bi
    app.kubernetes.io/component: batch-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-batch-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-batch-worker
        app.kubernetes.io/part-of: eve-bi
        app.kubernetes.io/component: batch-worker
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: eve-bi/batch-etl:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: EVE_BATCH_PARTITION_ROLE
              value: WORKER
            - name: EVE_BATCH_EXECUTION_MODE
              value: DAEMON
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.eve-system.svc.cluster.local:5432/eve_bi
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq.eve-system.svc.cluster.local
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
