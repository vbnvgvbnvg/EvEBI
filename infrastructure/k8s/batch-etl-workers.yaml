apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-batch-worker
  labels:
    app.kubernetes.io/name: eve-batch-worker
    app.kubernetes.io/part-of: eve-bi
    app.kubernetes.io/component: batch-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-batch-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-batch-worker
        app.kubernetes.io/part-of: eve-bi
        app.kubernetes.io/component: batch-worker
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: eve-bi/batch-etl:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
            - containerPort: 9083
              name: management
          env:
            - name: MANAGEMENT_SERVER_PORT
              value: "9083"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: EVE_BATCH_PARTITION_ROLE
              value: WORKER
            - name: EVE_BATCH_EXECUTION_MODE
              value: DAEMON
            - name: EVE_BATCH_RABBIT_HEALTH_ENABLED
              value: "true"
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.eve-system.svc.cluster.local:5432/eve_bi?sslmode=require
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eve-db-credentials
                  key: batch-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eve-db-credentials
                  key: batch-password
            - name: SPRING_LIQUIBASE_LIQUIBASE_SCHEMA
              value: "liquibase"
            - name: SPRING_LIQUIBASE_USER
              valueFrom:
                secretKeyRef:
                  name: eve-db-credentials
                  key: liquibase-username
            - name: SPRING_LIQUIBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eve-db-credentials
                  key: liquibase-password
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq.eve-system.svc.cluster.local
            - name: SPRING_RABBITMQ_PORT
              value: "5671"
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              value: "/eve_market"
            - name: SPRING_RABBITMQ_SSL_ENABLED
              value: "true"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eve-rabbitmq-credentials
                  key: batch-worker-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eve-rabbitmq-credentials
                  key: batch-worker-password
            - name: EVE_SECURITY_USER
              valueFrom:
                secretKeyRef:
                  name: eve-security-credentials
                  key: username
            - name: EVE_SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eve-security-credentials
                  key: password
            - name: EVE_SECURITY_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: eve-security-credentials
                  key: admin-api-keys
            - name: EVE_SECURITY_ACTUATOR_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: eve-security-credentials
                  key: actuator-api-keys
            - name: EVE_SECURITY_OPERATOR_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: eve-security-credentials
                  key: operator-api-keys
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9083
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
