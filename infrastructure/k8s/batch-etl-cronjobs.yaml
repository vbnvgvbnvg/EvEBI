apiVersion: batch/v1
kind: CronJob
metadata:
  name: eve-batch-sde-sync
  labels:
    app.kubernetes.io/name: eve-batch-sde-sync
    app.kubernetes.io/part-of: eve-bi
    app.kubernetes.io/component: batch-cronjob
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: eve-batch-sde-sync
        spec:
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: sde-sync
              image: eve-bi/batch-etl:latest
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 8083
                  name: http
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: EVE_BATCH_EXECUTION_MODE
                  value: SDE_SYNC
                - name: SPRING_PROFILES_ACTIVE
                  value: prod
                - name: SPRING_DATASOURCE_URL
                  value: jdbc:postgresql://postgres.eve-system.svc.cluster.local:5432/eve_bi
                - name: SPRING_RABBITMQ_HOST
                  value: rabbitmq.eve-system.svc.cluster.local
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2000m"
                  memory: "2Gi"
---
