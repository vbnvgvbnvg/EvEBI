spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eve_bi}?sslmode=${POSTGRES_SSL_MODE:require}
    password: ${POSTGRES_BATCH_PASSWORD}
  liquibase:
    password: ${POSTGRES_LIQUIBASE_PASSWORD}
  rabbitmq:
    port: ${RABBITMQ_AMQP_PORT:5671}
    password: ${RABBITMQ_PASS}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}

eve:
  security:
    password: ${EVE_SECURITY_PASSWORD}
    admin-api-keys: ${EVE_SECURITY_API_KEYS}
    actuator-api-keys: ${EVE_SECURITY_ACTUATOR_API_KEYS}
    operator-api-keys: ${EVE_SECURITY_OPERATOR_API_KEYS}
