server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: batch-etl

  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT:60s}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eve_bi}
    username: ${POSTGRES_USER:eve_user}
    password: ${POSTGRES_PASSWORD:eve_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BatchHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:eve_user}
    password: ${RABBITMQ_DEFAULT_PASS:eve_password}

eve:
  batch:
    chunk-size:
      daily-market-summary: ${EVE_BATCH_DAILY_CHUNK_SIZE:500}
      order-book-liquidity: ${EVE_BATCH_LIQUIDITY_CHUNK_SIZE:1000}
    async-launcher:
      core-pool-size: ${EVE_BATCH_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${EVE_BATCH_ASYNC_MAX_POOL_SIZE:4}
      queue-capacity: ${EVE_BATCH_ASYNC_QUEUE_CAPACITY:10}
    sde:
      items-url: ${EVE_SDE_ITEMS_URL:https://www.fuzzwork.co.uk/dump/latest/csv/invTypes.csv}
      stations-url: ${EVE_SDE_STATIONS_URL:https://www.fuzzwork.co.uk/dump/latest/csv/staStations.csv}
      user-agent: ${EVE_SDE_USER_AGENT:EveBI-BatchETL/1.0.0 (https://github.com/serbentd/EvEBI)}
      connect-timeout: ${EVE_SDE_CONNECT_TIMEOUT:10s}
      read-timeout: ${EVE_SDE_READ_TIMEOUT:60s}
      chunk-size: ${EVE_SDE_CHUNK_SIZE:1000}
    esi:
      regions-url: ${EVE_BATCH_ESI_REGIONS_URL:https://esi.evetech.net/latest/universe/regions/}
      names-url: ${EVE_BATCH_ESI_NAMES_URL:https://esi.evetech.net/latest/universe/names/}
      user-agent: ${EVE_BATCH_ESI_USER_AGENT:EveBI-BatchETL/1.0.0 (https://github.com/serbentd/EvEBI)}
      min-region-id: ${EVE_BATCH_ESI_MIN_REGION_ID:10000000}
      max-region-id: ${EVE_BATCH_ESI_MAX_REGION_ID:11000000}
      connect-timeout: ${EVE_BATCH_ESI_CONNECT_TIMEOUT:10s}
      read-timeout: ${EVE_BATCH_ESI_READ_TIMEOUT:30s}
    schedule:
      enabled: ${EVE_BATCH_SCHEDULE_ENABLED:true}
      sde-sync-cron: ${EVE_BATCH_SCHEDULE_SDE_SYNC_CRON:0 0 3 * * SUN}
      daily-summary-cron: ${EVE_BATCH_SCHEDULE_DAILY_SUMMARY_CRON:0 15 0 * * *}
      liquidity-cron: ${EVE_BATCH_SCHEDULE_LIQUIDITY_CRON:0 0/15 * * * *}
    remote-partitioning:
      role: ${EVE_BATCH_PARTITION_ROLE:STANDALONE}
      amqp-flows-enabled: ${EVE_BATCH_PARTITION_AMQP_FLOWS_ENABLED:true}
      exchange: ${EVE_BATCH_PARTITION_EXCHANGE:eve.batch.partition.exchange}
      requests-queue: ${EVE_BATCH_PARTITION_REQUESTS_QUEUE:eve.batch.partition.requests}
      requests-routing-key: ${EVE_BATCH_PARTITION_ROUTING_KEY:eve.batch.partition.requests}
      dead-letter-exchange: ${EVE_BATCH_PARTITION_DLX:eve.batch.partition.dlx}
      dead-letter-queue: ${EVE_BATCH_PARTITION_DLQ:eve.batch.partition.dlq}
      dead-letter-routing-key: ${EVE_BATCH_PARTITION_DLQ_ROUTING_KEY:eve.batch.partition.dlq}
      poll-interval: ${EVE_BATCH_PARTITION_POLL_INTERVAL:5s}
      timeout: ${EVE_BATCH_PARTITION_TIMEOUT:30m}
      worker-concurrency: ${EVE_BATCH_PARTITION_WORKER_CONCURRENCY:4}
      prefetch-count: ${EVE_BATCH_PARTITION_PREFETCH_COUNT:1}
      heavy-region-slices:
        10000002: ${EVE_BATCH_PARTITION_FORGE_SLICES:4}
        10000043: ${EVE_BATCH_PARTITION_DOMAIN_SLICES:2}

management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
      # The rabbit contributor is disabled by default on standalone (broker-less) deployments; allow
      # the readiness group to reference it without failing startup when rabbit health is disabled.
      validate-group-membership: false
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db, rabbit
  health:
    rabbit:
      enabled: ${EVE_BATCH_RABBIT_HEALTH_ENABLED:false}
