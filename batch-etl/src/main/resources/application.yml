server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: batch-etl

  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT:60s}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eve_bi}
    username: ${POSTGRES_USER:eve_user}
    password: ${POSTGRES_PASSWORD:eve_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BatchHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

eve:
  batch:
    chunk-size:
      daily-market-summary: ${EVE_BATCH_DAILY_CHUNK_SIZE:500}
      order-book-liquidity: ${EVE_BATCH_LIQUIDITY_CHUNK_SIZE:1000}
    sde:
      items-url: ${EVE_SDE_ITEMS_URL:https://www.fuzzwork.co.uk/dump/latest/invTypes.csv}
      stations-url: ${EVE_SDE_STATIONS_URL:https://www.fuzzwork.co.uk/dump/latest/staStations.csv}
      user-agent: ${EVE_SDE_USER_AGENT:EveBI-BatchETL/1.0.0 (https://github.com/serbentd/EvEBI)}
      connect-timeout: ${EVE_SDE_CONNECT_TIMEOUT:10s}
      read-timeout: ${EVE_SDE_READ_TIMEOUT:60s}
      chunk-size: ${EVE_SDE_CHUNK_SIZE:1000}

management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
