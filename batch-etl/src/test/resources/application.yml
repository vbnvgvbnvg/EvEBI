server:
  port: 0

spring:
  application:
    name: batch-etl-test

  datasource:
    url: jdbc:h2:mem:eve_batch_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  rabbitmq:
    listener:
      simple:
        auto-startup: false

eve:
  batch:
    chunk-size:
      daily-market-summary: 10
      order-book-liquidity: 10
    async-launcher:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 10
      await-termination: 60s
    sde:
      items-url: http://localhost:8089/dump/latest/invTypes.csv
      stations-url: http://localhost:8089/dump/latest/staStations.csv
      user-agent: EveBI-Test/1.0
      connect-timeout: 5s
      read-timeout: 5s
      chunk-size: 10
    esi:
      regions-url: classpath:/esi/regions.json
      names-url: classpath:/esi/names.json
      user-agent: EveBI-Test/1.0
      min-region-id: 10000000
      max-region-id: 11000000
      connect-timeout: 5s
      read-timeout: 5s
    schedule:
      enabled: false
      sde-sync-cron: "0 0 3 * * SUN"
      daily-summary-cron: "0 15 0 * * *"
      liquidity-cron: "0 0/15 * * * *"
    remote-partitioning:
      role: STANDALONE
      amqp-flows-enabled: true
      exchange: test.batch.partition.exchange
      requests-queue: test.batch.partition.requests
      requests-routing-key: test.batch.partition.requests
      dead-letter-exchange: test.batch.partition.dlx
      dead-letter-queue: test.batch.partition.dlq
      dead-letter-routing-key: test.batch.partition.dlq
      poll-interval: 100ms
      timeout: 10s
      worker-concurrency: 1
      prefetch-count: 1
      heavy-region-slices:
        10000002: 2
    kubernetes:
      pod-name: test-pod
      pod-node-name: test-node
      execution-mode: DAEMON
      exit-on-completion: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
  health:
    rabbit:
      enabled: false
