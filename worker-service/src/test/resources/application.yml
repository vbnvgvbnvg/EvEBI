spring:
  application:
    name: worker-service-test

  datasource:
    url: jdbc:h2:mem:eve_bi_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

eve:
  market:
    exchange: test.exchange
    queue: test.queue
    routing-key: test.routingKey
    dead-letter-exchange: test.dlx
    dead-letter-queue: test.dlq
    dead-letter-routing-key: test.dlq
    batch-size: 500
    queue-ttl: 2h
    queue-max-length: 1000000
  security:
    username: test-admin
    password: test-password
    api-key-header: X-API-Key
    admin-api-keys:
      - test-api-key
      - test-admin-key-rotated
    actuator-api-keys:
      - test-actuator-key
      - test-actuator-key-rotated

management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
  health:
    rabbit:
      enabled: false
